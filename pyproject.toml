[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cordex2energy"
version = "0.1.0"
description = "Climate Scenarios for Energy in Switzerland - A package for processing climate data and energy conversion"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Yann Yasser Haddad", email = "yasser.haddad@env.ethz.ch"}
]
keywords = ["climate", "energy", "cordex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "xarray>=0.19.0",
    "dask[complete]>=2021.0.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "cartopy>=0.19.0",
    "geopandas>=0.9.0",
    "regionmask>=0.9.0",
    "xclim>=0.28.0",
    "windpowerlib>=0.2.0",
    "scipy>=1.6.0",
    "statsmodels>=0.12.0",
    "netCDF4>=1.5.0",
    "zarr>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "flake8>=3.9",
    "mypy>=0.9",
    "ipython>=7.0",
    "jupyter>=1.0",
]

[project.urls]
Homepage = "https://github.com/yhaddad/ClimateScenarios4Energy-CH"
Repository = "https://github.com/yhaddad/ClimateScenarios4Energy-CH"
Documentation = "https://github.com/yhaddad/ClimateScenarios4Energy-CH/blob/main/README.md"

[tool.setuptools.packages.find]
include = ["cordex2energy*"]
namespaces = false

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
